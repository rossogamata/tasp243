<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Архітектура Docker-контейнера</title>
  <desc id="desc">Оригінальна ретро-мультяшна діаграма потоку від браузера до Docker-контейнера, мережі та тому.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="1" stop-color="#ffd98a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35b9c8"/>
      <stop offset="1" stop-color="#087b9d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#123047" flood-opacity=".2"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#17334d"/>
    </marker>
    <style>
      .ink { stroke:#17334d; stroke-width:7; stroke-linejoin:round; stroke-linecap:round; }
      .label { font-family:Verdana,Arial,sans-serif; fill:#17334d; font-weight:700; }
      .small { font-size:22px; }
      .big { font-size:32px; }
    </style>
  </defs>

  <rect width="1400" height="820" rx="42" fill="url(#sky)"/>
  <path d="M0 360 Q180 300 360 360 T720 360 T1080 360 T1400 360 V820 H0Z" fill="url(#water)"/>
  <path d="M0 375 Q180 315 360 375 T720 375 T1080 375 T1400 375" fill="none" stroke="#a4edf0" stroke-width="12" opacity=".75"/>
  <circle cx="113" cy="118" r="22" fill="#fff" stroke="#17334d" stroke-width="6"/>
  <circle cx="160" cy="78" r="12" fill="#fff" stroke="#17334d" stroke-width="5"/>
  <circle cx="1245" cy="155" r="16" fill="#fff" stroke="#17334d" stroke-width="5"/>

  <text x="700" y="76" text-anchor="middle" class="label" font-size="38">DOCKER: КОНТЕЙНЕР У ДІЇ</text>
  <text x="700" y="116" text-anchor="middle" class="label small" opacity=".78">мережа з'єднує, том зберігає, контейнер запускає</text>

  <!-- browser -->
  <g filter="url(#shadow)">
    <rect x="75" y="220" width="270" height="175" rx="24" fill="#fff" class="ink"/>
    <rect x="75" y="220" width="270" height="43" rx="21" fill="#e94b4b" class="ink"/>
    <circle cx="108" cy="242" r="8" fill="#ffd15c"/>
    <circle cx="136" cy="242" r="8" fill="#ffd15c"/>
    <circle cx="164" cy="242" r="8" fill="#ffd15c"/>
    <path d="M120 326 Q210 278 300 326" fill="none" stroke="#35b9c8" stroke-width="15"/>
    <text x="210" y="370" text-anchor="middle" class="label big">Браузер</text>
  </g>
  <path d="M350 310 H475" fill="none" class="ink" marker-end="url(#arrow)"/>
  <text x="413" y="283" text-anchor="middle" class="label small">localhost:8082</text>

  <!-- container -->
  <g filter="url(#shadow)">
    <rect x="490" y="185" width="425" height="245" rx="32" fill="#fff" class="ink"/>
    <rect x="490" y="185" width="425" height="55" rx="27" fill="#f2c94c" class="ink"/>
    <circle cx="530" cy="212" r="13" fill="#17334d"/>
    <circle cx="570" cy="212" r="13" fill="#17334d"/>
    <circle cx="610" cy="212" r="13" fill="#17334d"/>
    <rect x="550" y="278" width="305" height="82" rx="15" fill="#17334d"/>
    <path d="M585 319 l25 23 45-52" fill="none" stroke="#74d66f" stroke-width="13"/>
    <text x="700" y="402" text-anchor="middle" class="label big">CONTAINER</text>
    <text x="700" y="430" text-anchor="middle" class="label small">image → running process</text>
  </g>

  <!-- original cartoon mouse mascot -->
  <g transform="translate(1000 170)" filter="url(#shadow)">
    <circle cx="86" cy="48" r="47" fill="#263b55" class="ink"/>
    <circle cx="238" cy="48" r="47" fill="#263b55" class="ink"/>
    <circle cx="162" cy="135" r="101" fill="#4f6279" class="ink"/>
    <ellipse cx="162" cy="176" rx="66" ry="52" fill="#f7d49b" class="ink"/>
    <circle cx="130" cy="130" r="10" fill="#fff"/>
    <circle cx="194" cy="130" r="10" fill="#fff"/>
    <circle cx="130" cy="130" r="5" fill="#17334d"/>
    <circle cx="194" cy="130" r="5" fill="#17334d"/>
    <ellipse cx="162" cy="163" rx="18" ry="13" fill="#e94b4b" class="ink"/>
    <path d="M143 194 Q162 214 181 194" fill="none" class="ink"/>
    <path d="M84 230 Q162 276 240 230" fill="none" stroke="#e94b4b" stroke-width="28"/>
    <text x="162" y="318" text-anchor="middle" class="label big" fill="#fff">РОЗУМНИЙ</text>
    <text x="162" y="353" text-anchor="middle" class="label big" fill="#fff">КОНТЕЙНЕР</text>
  </g>

  <!-- network -->
  <g filter="url(#shadow)">
    <rect x="170" y="535" width="355" height="150" rx="25" fill="#a9edf0" class="ink"/>
    <path d="M240 622 H455 M347 570 V660" fill="none" class="ink" opacity=".65"/>
    <circle cx="240" cy="622" r="22" fill="#e94b4b" class="ink"/>
    <circle cx="347" cy="570" r="22" fill="#e94b4b" class="ink"/>
    <circle cx="455" cy="622" r="22" fill="#e94b4b" class="ink"/>
    <text x="347" y="716" text-anchor="middle" class="label big">NETWORK</text>
  </g>
  <path d="M600 430 C520 470 480 500 430 535" fill="none" class="ink" marker-end="url(#arrow)"/>

  <!-- volume -->
  <g filter="url(#shadow)">
    <path d="M760 560 L930 560 L990 605 L990 690 L820 690 L760 645Z" fill="#f2c94c" class="ink"/>
    <path d="M760 560 L820 605 L990 605 L930 560Z" fill="#ffe58c" class="ink"/>
    <path d="M820 605 V690" fill="none" class="ink"/>
    <path d="M760 645 L820 690" fill="none" class="ink"/>
    <text x="875" y="742" text-anchor="middle" class="label big">VOLUME</text>
    <text x="875" y="775" text-anchor="middle" class="label small">дані переживають контейнер</text>
  </g>
  <path d="M790 430 C815 470 840 510 855 560" fill="none" class="ink" marker-end="url(#arrow)"/>

  <text x="65" y="785" class="label small" opacity=".8">Групове заняття 2/4 · Docker fundamentals</text>
</svg>
