<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">Архітектура персонального Docker-контейнера</title>
  <desc id="desc">Браузер передає запит на порт хоста, Docker запускає контейнер NGINX із образом, зібраним із Dockerfile.</desc>
  <defs><linearGradient id="sea" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087e8b"/><stop offset="1" stop-color="#075269"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="0" flood-color="#102a43"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#ffd447"/></marker></defs>
  <rect width="1400" height="520" fill="url(#sea)"/><circle cx="1280" cy="82" r="28" fill="none" stroke="#b9eee4" stroke-width="4" opacity=".65"/><circle cx="118" cy="430" r="13" fill="none" stroke="#b9eee4" stroke-width="4" opacity=".65"/>
  <text x="70" y="76" fill="#ffd447" font-family="Trebuchet MS, sans-serif" font-size="24" font-weight="700" letter-spacing="3">ЗАНЯТТЯ 2_3 · МАРШРУТ КОНТЕЙНЕРА</text><text x="70" y="126" fill="#fffdf4" font-family="Trebuchet MS, sans-serif" font-size="44" font-weight="700">Від Dockerfile до власного прізвища</text>
  <g filter="url(#shadow)" stroke="#16324f" stroke-width="5"><rect x="75" y="220" width="235" height="145" rx="8" fill="#fffdf4"/><rect x="400" y="220" width="235" height="145" rx="8" fill="#ffd447"/><rect x="725" y="185" width="300" height="215" rx="8" fill="#f05d5e"/><rect x="1115" y="220" width="210" height="145" rx="8" fill="#d9f4ed"/></g>
  <g fill="#16324f" font-family="Trebuchet MS, sans-serif" text-anchor="middle"><text x="192" y="264" font-size="26" font-weight="700">Браузер</text><text x="192" y="301" font-size="20">localhost:8080</text><text x="192" y="335" font-size="17">запит курсанта</text><text x="517" y="264" font-size="26" font-weight="700">Dockerfile</text><text x="517" y="301" font-size="20">docker build</text><text x="517" y="335" font-size="17">рецепт образу</text><text x="875" y="232" font-size="26" font-weight="700">CONTAINER</text><text x="875" y="285" font-size="29">NGINX : 80</text><text x="875" y="330" font-size="18">site/index.html</text><text x="875" y="365" font-size="18">прізвище курсанта</text><text x="1220" y="264" font-size="26" font-weight="700">Docker Hub</text><text x="1220" y="301" font-size="20">docker push</text><text x="1220" y="335" font-size="17">власний registry</text></g>
  <path d="M315 292H390" stroke="#ffd447" stroke-width="8" marker-end="url(#arrow)"/><path d="M640 292H715" stroke="#ffd447" stroke-width="8" marker-end="url(#arrow)"/><path d="M1030 292H1105" stroke="#ffd447" stroke-width="8" marker-end="url(#arrow)"/>
  <text x="70" y="470" fill="#fffdf4" font-family="Trebuchet MS, sans-serif" font-size="19">Побудувати → запустити → перевірити → опублікувати</text>
</svg>